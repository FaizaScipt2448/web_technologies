<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Form - jQuery Validation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; padding: 20px; }
    .container { max-width: 600px; background: #fff; padding: 20px; border-radius: 8px; }
    .error { color: red; font-size: 0.9em; }
  </style>
</head>
<body>

<div class="container">
  <h2>Checkout Form</h2>
  <form id="checkoutForm">

    <div class="mb-3">
      <label>Full Name</label>
      <input type="text" id="fullname" class="form-control">
      <small class="error"></small>
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="text" id="email" class="form-control">
      <small class="error"></small>
    </div>

    <div class="mb-3">
      <label>Phone</label>
      <input type="text" id="phone" class="form-control">
      <small class="error"></small>
    </div>

    <div class="mb-3">
      <label>Address</label>
      <input type="text" id="address" class="form-control">
      <small class="error"></small>
    </div>

    <div class="mb-3">
      <label>City</label>
      <input type="text" id="city" class="form-control">
      <small class="error"></small>
    </div>

    <div class="mb-3">
      <label>Postal Code</label>
      <input type="text" id="postal" class="form-control">
      <small class="error"></small>
    </div>

    <div class="mb-3">
      <label>Country</label>
      <select id="country" class="form-select">
        <option value="">Select Country</option>
        <option value="Pakistan">Pakistan</option>
        <option value="USA">USA</option>
        <option value="Canada">Canada</option>
      </select>
      <small class="error"></small>
    </div>

    <div class="mb-3">
      <label>Payment Method</label><br>
      <input type="radio" name="payment" value="card"> Card
      <input type="radio" name="payment" value="cod"> Cash on Delivery
      <small class="error d-block"></small>
    </div>

    <div class="mb-3 card-fields" style="display:none;">
      <label>Card Number</label>
      <input type="text" id="cardNumber" class="form-control">
      <small class="error"></small>
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="terms">
      <label class="form-check-label">I agree to the terms & conditions</label>
      <small class="error d-block"></small>
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
  </form>

  <div id="successMsg" class="alert alert-success mt-3" style="display:none;">
    Form submitted successfully!
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="script.js"></script>

</body>
</html>
