<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FakeStore CRUD (Simple)</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script>
  <script src="script.js"></script>

  <style>
    /* your styles unchanged */
   body {
  font-family: Arial, Helvetica, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

.wrap {
  max-width: 1000px;
  margin: 20px auto;
  padding: 0 12px;
}

h2 {
  margin: 10px 0 16px;
}

.box {
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
}

.row {
  display: flex;
  gap: 10px;
  margin-bottom: 8px;
}

.row label {
  width: 110px;
  padding-top: 7px;
  font-size: 14px;
}

.row input,
.row textarea {
  flex: 1;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 6px;
}

.row textarea {
  height: 60px;
  resize: vertical;
}

.btn {
  padding: 8px 12px;
  border: 1px solid #ccc;
  background: #eee;
  border-radius: 6px;
  cursor: pointer;
}

.btn.primary {
  background: #3b82f6;
  border-color: #3b82f6;
  color: #fff;
}

.btn.warn {
  background: #f59e0b;
  border-color: #f59e0b;
  color: #fff;
}

.btn.danger {
  background: #ef4444;
  border-color: #ef4444;
  color: #fff;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 14px;
}

.card {
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  width: 220px;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: contain;
  background: #fff;
}

.card .p {
  padding: 10px;
}

.title {
  font-weight: bold;
  font-size: 14px;
  height: 38px;
  overflow: hidden;
}

.muted {
  color: #666;
  font-size: 12px;
}

.price {
  font-weight: bold;
  margin-top: 6px;
}

#loading {
  color: #666;
  padding: 10px 0;
}

#msg {
  display: none;
  margin-top: 8px;
  padding: 8px;
  background: #e8f5e9;
  border: 1px solid #b6e0c2;
  border-radius: 6px;
  color: #155724;
}

  </style>
</head>
<body>
  <div class="wrap">
    <h2>🛒 FakeStore CRUD</h2>

    <div class="box">
      <h3 id="formTitle" style="margin-top:0;">Create Product</h3>
      <input type="hidden" id="productId" />

      <!-- ✅ REAL FORM -->
      <form id="productForm">
        <div class="row">
          <label for="title">Title</label>
          <input id="title" type="text" placeholder="Product title" />
        </div>

        <div class="row">
          <label for="price">Price</label>
          <input id="price" type="number" placeholder="e.g. 99.99" />
        </div>

        <div class="row">
          <label for="category">Category</label>
          <input id="category" type="text" placeholder="e.g. electronics" />
        </div>

        <div class="row">
          <label for="image">Image URL</label>
          <input id="image" type="text" placeholder="https://..." />
        </div>

        <div class="row">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Short description..."></textarea>
        </div>

        <div class="actions">
          <button id="btnSave" class="btn primary" type="submit">Save</button>
          <button id="btnReset" class="btn" type="button">Reset</button>
          <span id="msg">Saved!</span>
        </div>
      </form>
    </div>

    <div class="box">
      <h3 style="margin-top:0;">Products</h3>
      <div id="loading">Loading products…</div>
      <div id="productList" class="grid"></div>
    </div>
  </div>
</body>
</html>
