<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout Page</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body { background-color: #f8f9fa; }
    .progress-steps { font-size: 0.9rem; }
    .order-summary { position: sticky; top: 10px; }
  </style>
</head>
<body>

  <div class="container my-4">

    <!-- 1️Progress Header -->
    <div class="mb-4">
      <div class="alert alert-primary text-center p-2">
        <strong>Steps:</strong> Cart → Address → <u>Payment</u> → Review
      </div>
    </div>

    <div class="row g-3">
      <!-- Left column: Customer & Payment Form -->
      <div class="col-12 col-md-7">

        <!--  Customer & Shipping Form -->
        <div class="p-3 bg-white shadow-sm rounded">
          <h4>Customer & Shipping Info</h4>
          <form>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" placeholder="0300-1234567">
            </div>

            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" placeholder="House no, Street, City">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">City</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Postal Code</label>
                <input type="number" class="form-control" placeholder="e.g. 54000">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Country</label>
              <select class="form-select">
                <option selected disabled>Select Country</option>
                <option>Pakistan</option>
                <option>USA</option>
                <option>UK</option>
              </select>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="sameAsShipping">
              <label class="form-check-label" for="sameAsShipping">
                Billing same as shipping
              </label>
            </div>

            <!--  Payment Section -->
            <h5>Payment Method</h5>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment" id="card" checked>
              <label class="form-check-label" for="card">Card</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment" id="cod">
              <label class="form-check-label" for="cod">Cash on Delivery</label>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="radio" name="payment" id="wallet">
              <label class="form-check-label" for="wallet">Wallet</label>
            </div>

            <div class="border rounded p-3 mb-3">
              <div class="mb-3">
                <label class="form-label">Cardholder Name</label>
                <input type="text" class="form-control">
              </div>
              <div class="mb-3">
                <label class="form-label">Card Number</label>
                <input type="text" class="form-control" placeholder="####-####-####-####">
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Expiry Date</label>
                  <input type="text" class="form-control" placeholder="MM/YY">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">CVV</label>
                  <input type="text" class="form-control" placeholder="123">
                </div>
              </div>
            </div>

          
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="terms">
              <label class="form-check-label" for="terms">I agree to the Terms & Conditions</label>
            </div>
            <button type="submit" class="btn btn-primary w-100" disabled>Place Order</button>
          </form>
        </div>
      </div>

      <!-- Right column: Order Summary -->
      <div class="col-12 col-md-5">
        <div class="p-3 bg-white shadow-sm rounded order-summary">
          <h4>Order Summary</h4>

          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between">
              <span>Product 1 (×2)</span> <span>Rs 1200</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span>Product 2 (×1)</span> <span>Rs 800</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <strong>Subtotal</strong> <strong>Rs 2000</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span>Shipping</span> <span>Rs 200</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span>Tax</span> <span>Rs 100</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <strong>Grand Total</strong> <strong>Rs 2300</strong>
            </li>
          </ul>

          <div class="input-group mb-2">
            <input type="text" class="form-control" placeholder="Coupon code">
            <button class="btn btn-outline-secondary">Apply</button>
          </div>
          <div class="alert alert-success p-2 text-center">Static demo only ✅</div>
        </div>
      </div>
    </div>
  </div>

<script>
  // Enable the "Place Order" button when terms checkbox is checked
  const terms = document.getElementById('terms');
  const btn = document.querySelector('button[type="submit"]');
  terms.addEventListener('change', () => {
    btn.disabled = !terms.checked;
  });
</script>

</body>
</html>
